# MySQL Data Source Configuration
# 'createDatabaseIfNotExist=true' tells MySQL to create the database if it isn't already present.
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacom?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate DDL Auto-Creation
# 'update' creates tables if they don't exist and safely updates them when entities change. 
# Use 'create' if you want to drop and recreate tables every time the application starts.
spring.jpa.hibernate.ddl-auto=update

# Hibernate Dialect (Optional for modern Spring Boot, but good for explicit configuration)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Show SQL statements in the console (helpful for debugging table creation)
spring.jpa.show-sql=true
